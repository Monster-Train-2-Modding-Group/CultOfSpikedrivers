[config]
schemaVersion = "0.0.1"

[package]
namespace = "Conductor"
name = "CultOfSpikedrivers"
versionNumber = "1.0.1"
description = "Mod that swaps the Cult of the Lamb Follower with Spikedriver Colony from MT1"
websiteUrl = "https://github.com/Monster-Train-2-Modding-Group/CultOfSpikedrivers"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"
MT2-Trainworks_Reloaded = "0.6.5"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./"

[[build.copy]]
source = "./plugin_build"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = [ "monster-train-2" ]


